name: Open Web UI Tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  open-web-ui-tests:
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - open-web

    env:
      WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
      DEFAULT_ACCOUNT_EMAIL: ${{ secrets.DEFAULT_ACCOUNT_EMAIL }}
      DEFAULT_ACCOUNT_PASSWORD: ${{ secrets.DEFAULT_ACCOUNT_PASSWORD }}
      DEFAULT_ACCOUNT_INVALID_PASSWORD: ${{ secrets.DEFAULT_ACCOUNT_INVALID_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Ensure artifact directories exist
        run: |
          mkdir -p report
          mkdir -p img
          mkdir -p logs

      - name: Run Open Web UI tests in virtualenv
        run: |
          python3 --version
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m compileall .
          python test_case/run.py
        # TODO: Start or connect the Open Web application before this step.
        # The current UI tests expect WEB_BASE_URL, defaulting to
        # http://localhost:3000/auth, to be reachable from the runner.
        # Do not commit config/config.yaml; provide sensitive values via
        # GitHub Secrets or environment variables.

      - name: Upload BeautifulReport artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-web-report
          path: report/
          if-no-files-found: warn

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-web-screenshots
          path: img/
          if-no-files-found: warn

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-web-logs
          path: logs/
          if-no-files-found: warn
